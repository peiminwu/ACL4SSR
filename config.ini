[custom]

; AI 使用单一规则列表；策略组手动选择具体节点，避免随测速自动切换出口。
ruleset=AI,quanx:https://raw.githubusercontent.com/storevip/Quantumult-X-Rules/main/AI.list

; 国内直连，其余走总代理。
ruleset=DIRECT,[]DOMAIN,smtp.gmail.com
ruleset=DIRECT,quanx:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/China/China.list
ruleset=DIRECT,[]GEOIP,CN
ruleset=🗽PROXY,[]FINAL

; 总代理提供全部地区入口。
custom_proxy_group=🗽PROXY`select`[]🇭🇰香港`[]🇺🇸美国`[]🇸🇬新加坡`[]🇹🇼台湾`[]🇯🇵日本`[]🌍其他
custom_proxy_group=AI`select`(?i)(?:🇸🇬|新加坡|狮城|獅城|Singapore|(?<![A-Za-z])SG[0-9]*(?![A-Za-z]))
custom_proxy_group=🇭🇰香港`url-test`(?i)(?:🇭🇰|香港|Hong[ _-]*Kong|(?<![A-Za-z])HK[0-9]*(?![A-Za-z]))`http://www.gstatic.com/generate_204`600,,100
custom_proxy_group=🇺🇸美国`url-test`(?i)(?:🇺🇸|美国|美國|United[ _-]*States|(?<![A-Za-z])USA?[0-9]*(?![A-Za-z]))`http://www.gstatic.com/generate_204`600,,100
custom_proxy_group=🇸🇬新加坡`url-test`(?i)(?:🇸🇬|新加坡|狮城|獅城|Singapore|(?<![A-Za-z])SG[0-9]*(?![A-Za-z]))`http://www.gstatic.com/generate_204`600,,100
custom_proxy_group=🇹🇼台湾`url-test`(?i)(?:🇹🇼|台湾|台灣|Taiwan|(?<![A-Za-z])TW[0-9]*(?![A-Za-z]))`http://www.gstatic.com/generate_204`600,,100
custom_proxy_group=🇯🇵日本`url-test`(?i)(?:🇯🇵|日本|Japan|(?<![A-Za-z])JP[0-9]*(?![A-Za-z]))`http://www.gstatic.com/generate_204`600,,100
custom_proxy_group=🌍其他`select`(?i)^(?!.*(?:(?:🇭🇰|香港|Hong[ _-]*Kong|(?<![A-Za-z])HK[0-9]*(?![A-Za-z]))|(?:🇺🇸|美国|美國|United[ _-]*States|(?<![A-Za-z])USA?[0-9]*(?![A-Za-z]))|(?:🇸🇬|新加坡|狮城|獅城|Singapore|(?<![A-Za-z])SG[0-9]*(?![A-Za-z]))|(?:🇹🇼|台湾|台灣|Taiwan|(?<![A-Za-z])TW[0-9]*(?![A-Za-z]))|(?:🇯🇵|日本|Japan|(?<![A-Za-z])JP[0-9]*(?![A-Za-z]))))(?!.*(?:套餐|流量|到期|剩余|重置|官网|网址|更新|频道)).+


enable_rule_generator=true
overwrite_original_rules=true
